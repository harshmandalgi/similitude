[project]
name = "similitude"
version = "0.1.0"
description = "Cheap mini versions of agent workflows that keep evals valid"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Harsh Mandalgi" }]
dependencies = [
    "openai>=1.60",
    "numpy>=2.0",
    "scipy>=1.14",
    "google-auth>=2.62.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/similitude"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/similitude/third_party"]  # vendored code stays as published

[tool.pytest.ini_options]
testpaths = ["tests"]
