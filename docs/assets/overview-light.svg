<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" role="img" aria-label="How Similitude works: shrink the full workflow into a miniature, then check that it picks the same winners">
<title>How Similitude works</title>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #0f172a; }
  .muted { fill: #64748b; }
  .accent { fill: #0f766e; }
  .b { font-weight: 700; }
  .sb { font-weight: 600; }
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
  </marker>
</defs>
<rect x="2" y="2" width="1096" height="326" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="28" y="46" font-size="21" class="b" text-anchor="start">How Similitude works</text>
<rect x="28" y="70" width="300" height="236" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="400.0" y="70" width="300" height="236" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="772.0" y="70" width="300" height="236" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<line x1="336" y1="188.0" x2="390.0" y2="188.0" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<text x="364.0" y="176.0" font-size="15" class="muted" text-anchor="middle">shrink</text>
<line x1="708.0" y1="188.0" x2="762.0" y2="188.0" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/>
<text x="736.0" y="176.0" font-size="15" class="muted" text-anchor="middle">compare</text>
<text x="178.0" y="114" font-size="22" class="b" text-anchor="middle">Full workflow</text>
<circle cx="78.0" cy="182" r="15.0" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<line x1="96.0" y1="182" x2="110.0" y2="182" stroke="#94a3b8" stroke-width="2"/>
<rect x="113.0" y="167.0" width="30.0" height="30.0" rx="5.0" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<line x1="146.0" y1="182" x2="160.0" y2="182" stroke="#94a3b8" stroke-width="2"/>
<circle cx="178.0" cy="182" r="15.0" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<line x1="196.0" y1="182" x2="210.0" y2="182" stroke="#94a3b8" stroke-width="2"/>
<rect x="213.0" y="167.0" width="30.0" height="30.0" rx="5.0" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<line x1="246.0" y1="182" x2="260.0" y2="182" stroke="#94a3b8" stroke-width="2"/>
<circle cx="278.0" cy="182" r="15.0" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="178.0" y="248" font-size="16" class="muted" text-anchor="middle">every call is real</text>
<text x="178.0" y="276" font-size="16" class="sb" text-anchor="middle">slow and costly</text>
<text x="550.0" y="114" font-size="22" class="b" text-anchor="middle">Miniature</text>
<circle cx="478.00000000000006" cy="182" r="10.799999999999999" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/>
<line x1="491.80000000000007" y1="182" x2="500.20000000000005" y2="182" stroke="#94a3b8" stroke-width="2"/>
<rect x="503.20000000000005" y="171.2" width="21.599999999999998" height="21.599999999999998" rx="3.5999999999999996" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/>
<line x1="527.8000000000001" y1="182" x2="536.2" y2="182" stroke="#94a3b8" stroke-width="2"/>
<circle cx="550.0" cy="182" r="10.799999999999999" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
<line x1="563.8000000000001" y1="182" x2="572.2" y2="182" stroke="#94a3b8" stroke-width="2"/>
<rect x="575.2" y="171.2" width="21.599999999999998" height="21.599999999999998" rx="3.5999999999999996" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 3"/>
<line x1="599.8000000000001" y1="182" x2="608.2" y2="182" stroke="#94a3b8" stroke-width="2"/>
<circle cx="622.0" cy="182" r="10.799999999999999" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="550.0" y="248" font-size="16" class="muted" text-anchor="middle">same code, cheap shortcuts</text>
<text x="550.0" y="276" font-size="16" class="sb accent" text-anchor="middle">down to 0.2× the cost</text>
<text x="922.0" y="114" font-size="22" class="b" text-anchor="middle">Same winners?</text>
<text x="922.0" y="146" font-size="16" class="muted" text-anchor="middle">as the full evaluation</text>
<rect x="790.0" y="174" width="264" height="44" rx="22" fill="#0f766e"/>
<text x="922.0" y="202.5" font-size="16" class="b" text-anchor="middle" style="fill:#ffffff">yes → test many changes on it</text>
<rect x="790.0" y="230" width="264" height="44" rx="22" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
<text x="922.0" y="258.5" font-size="16" class="muted" text-anchor="middle">no → try other shortcuts</text>
</svg>
